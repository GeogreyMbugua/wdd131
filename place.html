<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover Nairobi, Kenya's vibrant capital city. Explore attractions, culture, weather, and essential travel information."
    />
    <meta name="author" content="Geogrey M. Muiruri" />
    <link rel="stylesheet" href="styles/place.css" />

    <header>
      <h1>Nairobi, Kenya</h1>

    <main>
      <section class="hero">
        <picture>
          <source media="(min-width:1000px)" srcset="images/large.webp" />
          <source media="(min-width:600px)" srcset="images/medium.webp" />
          <img
            src="images/small.webp"
            alt="view of Nairobi City"
            width="640"
            height="427"
          />
        </picture>
      </section>
      <section class="data">
        <h2>Data</h2>
        <dl>
          <div>
            <dt>Area:</dt>
            <dd>696,272 km²</dd>
          </div>
          <div>
            <dt>Population:</dt>
            <dd>55,100,586</dd>
          </div>
          <div>
            <dt>Capital:</dt>
            <dd>Nairobi</dd>
          </div>
          <div>
            <dt>Languages:</dt>
            <dd>English, Swahili</dd>
          </div>
          <div>
            <dt>Currency:</dt>
            <dd>Kenyan Shilling</dd>
          </div>
          <div>
            <dt>Time Zone:</dt>
            <dd>UTC+3</dd>
          </div>
          <div>
            <dt>Calling Code:</dt>
            <dd>+254</dd>
          </div>
          <div>
            <dt>Internet TLD:</dt>
            <dd>.ke</dd>
          </div>
        </dl>
      </section>
