<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geogrey M. Muiruri</title>
    <link rel="stylesheet" href="styles/layout.css" />
  </head>
  <body>
    <!-- the header section -->
    <header class="page-header">
      <div class="course-title">
        <p>WDD131: Dynamic Web Fundamentals</p>
      </div>

      <nav class="navigation" aria-label="Main navigation">
        <ul>
          <li><a href="#linked-in">LinkedIn</a></li>
          <li><a href="#i-learn">I-Learn</a></li>
          <li><a href="#scripture">Scripture</a></li>
          <li><a href="#final-project">Final Project</a></li>
        </ul>
      </nav>
    </header>
    <!-- Main content -->
    <main class="main-content">
      <h1>Geogrey M. Muiruri</h1>
      <div class="main-grid">
        <!-- the about section has a p tag and an image -->
        <section class="about-card">
          <header class="card-header">
            <h2>About Me</h2>
          </header>
          <div class="card-content">
            <!-- introduction -->
            <div class="about-introduction">
              <p>Intro</p>
              <img
                src="images/profile.jpg"
                alt="Portrait of Geogrey M. Muiruri"
              />
            </div>
            <section class="location">
              <h3>Nairobi, Kenya</h3>
              <div class="location-content">
                <figure>
                  <img src="images/kenyan-flag.png" alt="Flag of Kenya" />
                  <figcaption>Official flag of Kenya</figcaption>
                </figure>
                <p>About Kenya</p>
              </div>
            </section>
           
          </div>
        </section>
         <aside class="resources-card">
                <header class="card-header">
                    <h2>Web Dev Resources</h2>
                </header>
                <div class="card-content">
                    <ul>
                        <li>
                            <a href="#">Dev.to Community</a>
                        </li>
                        <li>
                            <a href="#">SSmashing Magazine</a>
                        </li>
                       <li>
                            <a href="#">CSS Tricks</a>
                        </li>
                      <li>
                            <a href="#">W3 Schools</a>
                        </li>
                        <li>
                            <a href="#">Udemy</a>
                        </li>
                    </ul>
                </div>

            </aside>
      </div>
    </main>
  </body>
</html>
